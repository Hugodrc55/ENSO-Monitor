# Configuration d'Alembic, l'outil de migrations du schéma PostgreSQL.
# L'URL de la base n'est pas écrite ici : alembic/env.py lit DATABASE_URL,
# comme SQLAlchemy (voir app/database.py et .env.example).
#
# Depuis la racine du dépôt :
#   .\backend\.venv\Scripts\python.exe -m alembic -c backend/alembic.ini upgrade head

[alembic]
# Dossier des migrations, relatif à ce fichier.
script_location = %(here)s/alembic

# Rend le paquet « app » importable par alembic/env.py, quel que soit le dossier courant.
prepend_sys_path = %(here)s
path_separator = os

output_encoding = utf-8

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
